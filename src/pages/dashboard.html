<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
  <meta name="theme-color" content="#1E7CBA">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="description" content="Dashboard - Sistema de Registro de Asistencia">
  <meta name="author" content="MI Technologies, Inc.">
  <title>Dashboard - Sistema de Asistencia | MI Technologies</title>

  <!-- Stylesheets -->
  <link rel="stylesheet" href="../assets/css/main.css">
  <link rel="stylesheet" href="../assets/css/dashboard.css">

  <!-- Favicon (optional - add if available) -->
  <!-- <link rel="icon" type="image/png" href="assets/img/favicon.png"> -->
</head>
<body>
  <div class="dashboard-page">
    <!-- Navbar -->
    <nav class="dashboard-navbar">
      <div class="navbar-content">
        <!-- Logo and Title -->
        <div class="navbar-logo">
          <img src="../assets/img/logo.png" alt="MI Technologies">
          <span class="navbar-title">Sistema de Asistencia</span>
        </div>

        <!-- User Info and Logout -->
        <div class="navbar-user">
          <div class="user-info">
            <div class="user-avatar" id="userAvatar">U</div>
            <span class="user-name" id="userName">Usuario</span>
          </div>
          <button class="btn-logout" id="logoutBtn">
            Cerrar Sesión
          </button>
        </div>
      </div>
    </nav>

    <!-- Main Content -->
    <main class="dashboard-main">
      <div class="placeholder-content">
        <!-- Icon -->
        <div class="placeholder-icon">
          <svg xmlns="http://www.w3.org/2000/svg" fill="currentColor" viewBox="0 0 16 16">
            <path d="M8 4.754a3.246 3.246 0 1 0 0 6.492 3.246 3.246 0 0 0 0-6.492zM5.754 8a2.246 2.246 0 1 1 4.492 0 2.246 2.246 0 0 1-4.492 0z"/>
            <path d="M9.796 1.343c-.527-1.79-3.065-1.79-3.592 0l-.094.319a.873.873 0 0 1-1.255.52l-.292-.16c-1.64-.892-3.433.902-2.54 2.541l.159.292a.873.873 0 0 1-.52 1.255l-.319.094c-1.79.527-1.79 3.065 0 3.592l.319.094a.873.873 0 0 1 .52 1.255l-.16.292c-.892 1.64.901 3.434 2.541 2.54l.292-.159a.873.873 0 0 1 1.255.52l.094.319c.527 1.79 3.065 1.79 3.592 0l.094-.319a.873.873 0 0 1 1.255-.52l.292.16c1.64.893 3.434-.902 2.54-2.541l-.159-.292a.873.873 0 0 1 .52-1.255l.319-.094c1.79-.527 1.79-3.065 0-3.592l-.319-.094a.873.873 0 0 1-.52-1.255l.16-.292c.893-1.64-.902-3.433-2.541-2.54l-.292.159a.873.873 0 0 1-1.255-.52l-.094-.319z"/>
          </svg>
        </div>

        <!-- Title and Description -->
        <h2>Sistema en Desarrollo</h2>
        <p>
          Esta sección está siendo construida.<br>
          Próximamente podrás registrar asistencia, ver reportes y gestionar tu información.
        </p>

        <!-- Status Badge -->
        <span class="placeholder-badge">En construcción</span>
      </div>
    </main>

    <!-- Footer -->
    <footer class="dashboard-footer">
      <p>&copy; 2026 MI Technologies, Inc. Todos los derechos reservados.</p>
    </footer>
  </div>

  <!-- Scripts -->
  <script src="../assets/js/utils.js"></script>
  <script src="../assets/js/auth.js"></script>
  <script>
    // Initialize on page load
    document.addEventListener('DOMContentLoaded', () => {
      // Protect page - require authentication
      requireAuth();

      // Get current user
      const user = getCurrentUser();

      if (user) {
        // Update user info in navbar
        const userNameElement = document.getElementById('userName');
        const userAvatarElement = document.getElementById('userAvatar');

        if (userNameElement) {
          userNameElement.textContent = user.username;
        }

        if (userAvatarElement) {
          userAvatarElement.textContent = getInitials(user.username);
        }
      }

      // Handle logout button
      const logoutBtn = document.getElementById('logoutBtn');
      if (logoutBtn) {
        logoutBtn.addEventListener('click', () => {
          if (confirm('¿Estás seguro de que deseas cerrar sesión?')) {
            logout();
          }
        });
      }
    });
  </script>
</body>
</html>

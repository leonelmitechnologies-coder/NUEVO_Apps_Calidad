<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#1E7CBA">
  <title>Usuarios - QC Manager</title>

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="../assets/img/logo.png">

  <!-- Stylesheets -->
  <link rel="stylesheet" href="../assets/css/main.css">
  <link rel="stylesheet" href="../assets/css/dashboard.css">

  <!-- JavaScript -->
  <script src="../assets/js/utils.js"></script>
</head>
<body>
  <div class="dashboard-page">
    <!-- Navbar -->
    <nav class="dashboard-navbar">
      <div class="navbar-content">
        <!-- Back Button -->
        <button class="btn-back-nav" id="backBtn" title="Volver">
          <svg xmlns="http://www.w3.org/2000/svg" fill="currentColor" viewBox="0 0 16 16">
            <path fill-rule="evenodd" d="M15 8a.5.5 0 0 0-.5-.5H2.707l3.147-3.146a.5.5 0 1 0-.708-.708l-4 4a.5.5 0 0 0 0 .708l4 4a.5.5 0 0 0 .708-.708L2.707 8.5H14.5A.5.5 0 0 0 15 8z"/>
          </svg>
        </button>

        <!-- Logo and Title -->
        <div class="navbar-logo">
          <span class="navbar-title">Sistema de Asistencia</span>
        </div>

        <!-- User Info and Logout -->
        <div class="navbar-user">
          <div class="user-info">
            <div class="user-avatar" id="userAvatar">U</div>
            <span class="user-name" id="userName">Usuario</span>
          </div>
          <button class="btn-logout" id="logoutBtn">
            Cerrar Sesión
          </button>
        </div>
      </div>
    </nav>

    <!-- Main Content -->
    <main class="dashboard-main">
      <div class="dashboard-container">
        <!-- Módulo vacío -->
      </div>
    </main>
  </div>

  <script src="../assets/js/auth.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      // Protect page - require authentication
      requireAuth();

      // Initialize smart back button
      initBackButton();

      // Set user info
      const user = getUser();
      if (user) {
        document.getElementById('userName').textContent = user.username;
        document.getElementById('userAvatar').textContent = user.username.charAt(0).toUpperCase();
      }

      // Logout
      document.getElementById('logoutBtn').addEventListener('click', () => {
        logout();
      });
    });
  </script>
</body>
</html>

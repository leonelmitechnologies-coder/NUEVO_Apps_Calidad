<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Sistema de Registro de Asistencia - MI Technologies">
  <meta name="author" content="MI Technologies, Inc.">
  <title>Login - Sistema de Asistencia | MI Technologies</title>

  <!-- Stylesheets -->
  <link rel="stylesheet" href="assets/css/main.css">
  <link rel="stylesheet" href="assets/css/login.css">

  <!-- Favicon (optional - add if available) -->
  <!-- <link rel="icon" type="image/png" href="assets/img/favicon.png"> -->
</head>
<body>
  <div class="login-page">
    <div class="login-container">
      <div class="login-card">
        <!-- Logo -->
        <div class="login-logo">
          <img src="assets/img/logo.png" alt="MI Technologies Logo">
        </div>

        <!-- Header -->
        <div class="login-header">
          <h1>Bienvenido</h1>
          <p>Ingresa tus credenciales para acceder al sistema</p>
        </div>

        <!-- Login Form -->
        <form class="login-form" id="loginForm" novalidate>
          <!-- Username Field -->
          <div class="form-group">
            <label for="username" class="form-label">Usuario</label>
            <div class="form-input-wrapper">
              <input
                type="text"
                id="username"
                name="username"
                class="form-control"
                placeholder="Ingresa tu usuario"
                autocomplete="username"
                required
                aria-required="true"
              >
            </div>
          </div>

          <!-- Password Field -->
          <div class="form-group">
            <label for="password" class="form-label">Contraseña</label>
            <div class="form-input-wrapper">
              <input
                type="password"
                id="password"
                name="password"
                class="form-control"
                placeholder="Ingresa tu contraseña"
                autocomplete="current-password"
                required
                aria-required="true"
              >
              <button
                type="button"
                class="password-toggle"
                aria-label="Mostrar contraseña"
              >
                <svg xmlns="http://www.w3.org/2000/svg" fill="currentColor" viewBox="0 0 16 16">
                  <path d="M16 8s-3-5.5-8-5.5S0 8 0 8s3 5.5 8 5.5S16 8 16 8zM1.173 8a13.133 13.133 0 0 1 1.66-2.043C4.12 4.668 5.88 3.5 8 3.5c2.12 0 3.879 1.168 5.168 2.457A13.133 13.133 0 0 1 14.828 8c-.058.087-.122.183-.195.288-.335.48-.83 1.12-1.465 1.755C11.879 11.332 10.119 12.5 8 12.5c-2.12 0-3.879-1.168-5.168-2.457A13.134 13.134 0 0 1 1.172 8z"/>
                  <path d="M8 5.5a2.5 2.5 0 1 0 0 5 2.5 2.5 0 0 0 0-5zM4.5 8a3.5 3.5 0 1 1 7 0 3.5 3.5 0 0 1-7 0z"/>
                </svg>
              </button>
            </div>
          </div>

          <!-- Remember Me Checkbox -->
          <div class="checkbox-group">
            <label class="custom-checkbox">
              <input type="checkbox" id="rememberMe" name="rememberMe">
              <span class="checkbox-box"></span>
              <span class="checkbox-label">Recordar sesión</span>
            </label>
          </div>

          <!-- Submit Button -->
          <button type="submit" class="btn-login">
            Iniciar Sesión
          </button>

          <!-- Forgot Password Link -->
          <div class="forgot-password">
            <a href="#" id="forgotPasswordLink">¿Olvidaste tu contraseña?</a>
          </div>
        </form>
      </div>

      <!-- Footer -->
      <div class="login-footer">
        <p>&copy; 2026 MI Technologies, Inc. Todos los derechos reservados.</p>
      </div>
    </div>
  </div>

  <!-- Scripts -->
  <script src="assets/js/utils.js"></script>
  <script src="assets/js/auth.js"></script>
  <script>
    // Initialize on page load
    document.addEventListener('DOMContentLoaded', () => {
      // Redirect if already logged in
      redirectIfAuthenticated();

      // Setup password toggle
      setupPasswordToggle();

      // Setup input validation
      setupInputValidation();

      // Handle form submission
      const loginForm = document.getElementById('loginForm');
      loginForm.addEventListener('submit', handleLogin);

      // Handle forgot password
      const forgotPasswordLink = document.getElementById('forgotPasswordLink');
      forgotPasswordLink.addEventListener('click', handleForgotPassword);
    });
  </script>
</body>
</html>
